name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "package.json"
      - "src/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch official CodeHarborX icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Invoke-WebRequest "https://codeharborx.floot.app/_cdn/static/9a83e5b8-1bf8-4b6e-9c29-640716acdcc2-codeharborx-icon-512.png" -OutFile "build/icon.png"
          Copy-Item "build/icon.png" "src/icon.png" -Force

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist" -Filter "CodeHarborX-Desktop-Agent-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "CodeHarborX Windows installer was not created."
          }
          $latest = Get-ChildItem -Path "dist" -Filter "latest.yml" | Select-Object -First 1
          if (-not $latest) {
            throw "CodeHarborX update metadata latest.yml was not created."
          }
          Write-Host "Verified installer: $($installer.Name)"
          Write-Host "Verified updater metadata: $($latest.Name)"
