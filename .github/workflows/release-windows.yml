name: Publish Windows Update

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "package.json"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch official CodeHarborX icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Invoke-WebRequest "https://codeharborx.floot.app/_cdn/static/9a83e5b8-1bf8-4b6e-9c29-640716acdcc2-codeharborx-icon-512.png" -OutFile "build/icon.png"
          Copy-Item "build/icon.png" "src/icon.png" -Force

      - name: Install dependencies
        run: npm install

      - name: Publish GitHub release
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
