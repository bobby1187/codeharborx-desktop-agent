name: Publish Windows Update

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "package.json"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build and validate tunnel supervisor
        run: |
          npm run build:tunnel-host
          npm test
          npx electron test/electron-smoke.js

      - name: Save light and dark dialog previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeharborx-dialog-previews
          path: ../../outputs/CodeHarborX-*.png
          if-no-files-found: warn

      - name: Publish GitHub release
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
