name: Import Official CodeHarborX Branding

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/import-branding.yml"

permissions:
  contents: write

jobs:
  import-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import approved CodeHarborX assets
        run: |
          mkdir -p build
          curl -fL "https://codeharborx.floot.app/_cdn/static/204247df-421c-4698-a5fe-c49a4c522720-codeharborx-app-icon.png" -o build/icon.png
          curl -fL "https://codeharborx.floot.app/_cdn/static/c3f8cea1-e572-4dab-b765-4bf7a7db7c5f-codeharborx-logo.png" -o build/logo.png
          test -s build/icon.png
          test -s build/logo.png

      - name: Store branding permanently in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/icon.png build/logo.png
          git commit -m "Store official CodeHarborX branding locally" || exit 0
          git push
